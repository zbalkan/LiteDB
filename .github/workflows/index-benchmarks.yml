name: Index Benchmark Smoke

on:
  push:
    branches:
      - 'research/index-*'
    paths:
      - 'LiteDB/**'
      - 'LiteDB.Benchmarks/**'
      - '.github/workflows/index-benchmarks.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Scalar index benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore benchmark project
        run: dotnet restore LiteDB.Benchmarks/LiteDB.Benchmarks.csproj

      - name: Build benchmark project
        run: dotnet build LiteDB.Benchmarks/LiteDB.Benchmarks.csproj --configuration Release --no-restore

      - name: Run point-lookup smoke benchmarks
        run: >-
          dotnet run --configuration Release
          --project LiteDB.Benchmarks/LiteDB.Benchmarks.csproj
          --no-build --
          --filter '*IndexPointLookupBenchmark*'
          --launchCount 1
          --warmupCount 1
          --iterationCount 3

      - name: Verify benchmark measurements
        run: |
          report=$(find BenchmarkDotNet.Artifacts/results -name '*IndexPointLookupBenchmark-report-github.md' -print -quit)
          test -n "$report"
          test -s "$report"
          if grep -R -q 'There are not any results runs\|executed benchmarks: 0' BenchmarkDotNet.Artifacts; then
            echo 'BenchmarkDotNet produced no measurements.'
            cat "$report"
            exit 1
          fi
          if ! grep -q 'IndexedHit' "$report" || ! grep -q 'IndexedMiss' "$report"; then
            echo 'Expected point-lookup benchmark rows were not produced.'
            cat "$report"
            exit 1
          fi

      - name: Upload BenchmarkDotNet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-benchmark-smoke
          path: BenchmarkDotNet.Artifacts
          if-no-files-found: warn
